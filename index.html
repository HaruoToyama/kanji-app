<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>かんじクイズ</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- スタート画面 -->
    <div id="screen-start" class="screen">
      <h1>🌸 かんじクイズ 🌸</h1>
      <p class="subtitle">小学生むけ 漢字クイズ</p>
      <button id="btn-start" class="btn-primary">スタート！</button>
    </div>

    <!-- 問題画面 -->
    <div id="screen-quiz" class="screen hidden">
      <div id="progress-bar-wrap">
        <div id="progress-bar"></div>
      </div>
      <p id="question-count"></p>
      <p id="score-display"></p>
      <div id="question-box">
        <p id="question-text"></p>
      </div>
      <div id="choices"></div>
      <div id="feedback" class="hidden"></div>
      <button id="btn-next" class="btn-primary hidden">つぎへ →</button>
    </div>

    <!-- 結果画面 -->
    <div id="screen-result" class="screen hidden">
      <h2>おわったよ！🎉</h2>
      <p id="result-message"></p>
      <p id="result-score"></p>
      <button id="btn-retry" class="btn-primary">もういちど！</button>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
